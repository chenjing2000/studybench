[project]
name = "studybench"
version = "0.13.12"
description = "A simple offline English studybench built with PySide6."
requires-python = ">=3.11,<3.12"
dependencies = [
    "PySide6>=6.8,<7",
    "edge-tts>=7.0,<8",
    "mdict-utils==1.3.14",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
